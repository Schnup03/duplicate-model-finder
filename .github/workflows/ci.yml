name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Concurrency: cancel in-progress runs on the same branch to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege defaults; jobs that need write access widen explicitly.
permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  gradio-ui:
    name: Gradio 3.41.2 UI integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Install WebUI Gradio and tests
        run: python -m pip install pytest 'gradio==3.41.2' 'huggingface-hub<1'
      - name: Run Gradio integration tests
        run: python -m pytest tests/test_real_gradio_ui.py -v --tb=short

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Pinned, not floating: an unpinned `pip install ruff mypy` breaks the
      # build whenever upstream releases (mypy 2.4.0 rejected an import pattern
      # that 2.3.1 accepts). The pins are the versions verified locally, and
      # bumps happen on purpose in their own PR.
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff==0.15.11' 'mypy==2.3.1'
      # ruff covers scripts/ and tests/ — the formatting and lint rules the
      # repo declares in pyproject.toml and .pre-commit-config.yaml. Those were
      # configured but never executed anywhere, so drift went unnoticed.
      - name: ruff
        run: ruff check scripts/ tests/ && ruff format --check scripts/ tests/
      # mypy covers the shipped plugin only. tests/ is excluded on purpose: the
      # legacy suites pass pathlib.Path objects into helpers annotated `str`,
      # which is legal at runtime. Fixing 35 pre-existing findings is its own
      # change, not a reason to block every future PR.
      - name: mypy
        run: mypy scripts/

  secret-scan:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        # UPLOAD_ARTIFACTS is intentionally omitted to avoid uploading
        # logs / SARIF that might contain raw secret previews.
